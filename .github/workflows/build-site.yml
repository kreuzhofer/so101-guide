name: Build site

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install MkDocs
        run: pip install -r requirements.txt

      # mkdocs.yml sets strict mode, so broken links between chapters fail the build.
      - name: Build
        run: mkdocs build

      - name: Upload site as build artifact
        uses: actions/upload-artifact@v7
        with:
          name: site
          path: site/
          retention-days: 14

      - name: Upload site for GitHub Pages
        if: github.ref == 'refs/heads/main' && vars.DEPLOY_PAGES == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/

  # Publishing is opt-in: it only runs on main when the repository variable
  # DEPLOY_PAGES is set to "true" and Pages is set to deploy from GitHub Actions.
  deploy:
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_PAGES == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
